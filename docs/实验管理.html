<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MonoDGP 实验管理台</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --surface: #fff;
      --surface-2: #f7f9fc;
      --text: #182230;
      --muted: #657487;
      --line: #dbe3ed;
      --accent: #2c66d6;
      --accent-soft: #e8f0ff;
      --good: #1f7a4d;
      --good-soft: #e7f6ed;
      --warn: #9b6210;
      --warn-soft: #fff4df;
      --bad: #a33b3b;
      --bad-soft: #ffebeb;
      --shadow: 0 14px 36px rgb(25 49 83 / 8%);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #11161e;
        --surface: #1a222d;
        --surface-2: #222c38;
        --text: #edf2f8;
        --muted: #aab7c7;
        --line: #3a4655;
        --accent: #86afff;
        --accent-soft: #243b64;
        --good: #79d09c;
        --good-soft: #183a29;
        --warn: #e4b15e;
        --warn-soft: #3a2d1b;
        --bad: #ff9a9a;
        --bad-soft: #422527;
        --shadow: 0 16px 40px rgb(0 0 0 / 22%);
      }
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    .visually-hidden {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
        "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.6;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .topbar {
      padding: 42px max(22px, calc((100vw - 1320px) / 2)) 34px;
      border-bottom: 1px solid var(--line);
      background: radial-gradient(circle at 84% 4%, rgb(88 140 255 / 18%), transparent 32%),
        linear-gradient(135deg, var(--surface), var(--surface-2));
    }
    .topbar-inner { max-width: 1320px; margin: 0 auto; }
    .eyebrow { color: var(--accent); font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    h1, h2, h3, h4 { line-height: 1.25; letter-spacing: -.015em; }
    h1 { margin: 8px 0 10px; font-size: clamp(30px, 5vw, 46px); }
    h2 { margin: 0 0 12px; font-size: 26px; }
    h3 { margin: 0 0 10px; font-size: 19px; }
    h4 { margin: 0 0 8px; font-size: 15px; }
    .lead { max-width: 820px; margin: 0; color: var(--muted); font-size: 16px; }
    .top-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
    .top-actions a, .ghost-button {
      display: inline-flex; align-items: center; gap: 6px; padding: 8px 13px;
      border: 1px solid var(--line); border-radius: 9px; background: var(--surface);
      color: var(--text); font-size: 13px; font-weight: 650; text-decoration: none;
    }
    .top-actions a:hover, .ghost-button:hover { border-color: var(--accent); color: var(--accent); text-decoration: none; }
    .app {
      display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 28px;
      max-width: 1320px; margin: 0 auto; padding: 28px 22px 68px;
    }
    .sidebar { position: sticky; top: 18px; align-self: start; }
    .side-card, .panel, .detail-card {
      border: 1px solid var(--line); border-radius: 14px; background: var(--surface); box-shadow: var(--shadow);
    }
    .side-card { padding: 16px; }
    .side-card + .side-card { margin-top: 14px; }
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .stat { padding: 10px; border-radius: 9px; background: var(--surface-2); }
    .stat strong { display: block; font-size: 22px; line-height: 1.1; color: var(--accent); }
    .stat span { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; }
    .side-title { margin: 0 0 9px; color: var(--muted); font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
    .view-nav { display: grid; gap: 5px; }
    .view-nav button {
      width: 100%; padding: 9px 10px; border: 0; border-radius: 8px; background: transparent;
      color: var(--muted); text-align: left; font-size: 13px;
    }
    .view-nav button:hover, .view-nav button.active { background: var(--accent-soft); color: var(--accent); font-weight: 750; }
    .source-note { color: var(--muted); font-size: 12px; }
    .source-note code { display: inline-block; margin-top: 4px; padding: 2px 5px; border-radius: 4px; background: var(--surface-2); font-size: 11px; }
    main { min-width: 0; }
    .panel { padding: 20px; }
    .panel + .panel { margin-top: 16px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 18px; }
    .search { flex: 1 1 260px; position: relative; }
    .search input, .toolbar select, .todo-form input, .todo-form textarea, .thought-box textarea {
      width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 9px;
      background: var(--surface-2); color: var(--text); outline: none;
    }
    .search input:focus, .toolbar select:focus, .todo-form input:focus, .todo-form textarea:focus, .thought-box textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgb(44 102 214 / 12%); }
    .toolbar select { width: auto; min-width: 130px; }
    .toolbar-note { margin-left: auto; color: var(--muted); font-size: 12px; }
    .experiment-list { display: grid; gap: 10px; }
    .experiment-card {
      display: grid; grid-template-columns: 62px minmax(0, 1fr) auto; gap: 14px; align-items: start;
      width: 100%; padding: 15px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface);
      color: var(--text); text-align: left; transition: border-color .15s, transform .15s, box-shadow .15s;
    }
    .experiment-card:hover { border-color: var(--accent); box-shadow: 0 8px 24px rgb(44 102 214 / 9%); transform: translateY(-1px); }
    .exp-number { display: grid; place-items: center; min-height: 43px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); font-size: 20px; font-weight: 850; }
    .exp-title { margin: 0; font-size: 16px; }
    .exp-meta { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; margin-top: 5px; color: var(--muted); font-size: 12px; }
    .exp-preview { margin: 7px 0 0; color: var(--muted); font-size: 13px; }
    .status { display: inline-flex; align-items: center; padding: 3px 8px; border-radius: 999px; font-size: 11px; font-weight: 750; line-height: 1.35; }
    .status.good { color: var(--good); background: var(--good-soft); }
    .status.bad { color: var(--bad); background: var(--bad-soft); }
    .status.warn { color: var(--warn); background: var(--warn-soft); }
    .status.neutral { color: var(--muted); background: var(--surface-2); }
    .exp-arrow { padding-top: 9px; color: var(--muted); font-size: 20px; }
    .empty { padding: 36px 16px; border: 1px dashed var(--line); border-radius: 12px; color: var(--muted); text-align: center; }
    .detail-head { display: flex; gap: 14px; align-items: flex-start; justify-content: space-between; margin-bottom: 18px; }
    .detail-number { display: inline-grid; place-items: center; min-width: 48px; height: 48px; margin-right: 10px; border-radius: 11px; background: var(--accent-soft); color: var(--accent); font-size: 21px; font-weight: 850; vertical-align: middle; }
    .detail-title { display: inline; font-size: clamp(22px, 4vw, 32px); vertical-align: middle; }
    .back-button { padding: 8px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); color: var(--text); white-space: nowrap; }
    .back-button:hover { border-color: var(--accent); color: var(--accent); }
    .detail-meta { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 20px; color: var(--muted); font-size: 13px; }
    .detail-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .detail-card { padding: 18px; box-shadow: none; }
    .detail-card.full { grid-column: 1 / -1; }
    .detail-card p { margin: 0; white-space: pre-wrap; }
    .detail-card p + p { margin-top: 10px; }
    .detail-card ul { margin: 0; padding-left: 21px; }
    .detail-card li + li { margin-top: 6px; }
    .visual-review { overflow: hidden; }
    .visual-review > h3 { margin-bottom: 14px; }
    .center-picture { display: grid; grid-template-columns: minmax(220px, .8fr) minmax(260px, 1.2fr); gap: 18px; align-items: center; padding: 14px; border-radius: 12px; background: var(--surface-2); }
    .center-picture svg { width: 100%; max-height: 190px; }
    .center-picture .car-shape { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
    .center-picture .box-shape { fill: none; stroke: var(--muted); stroke-width: 2; stroke-dasharray: 6 5; }
    .center-picture .true2d-dot { fill: var(--warn); }
    .center-picture .projected-dot { fill: var(--accent); }
    .center-legend { display: grid; gap: 12px; }
    .center-key { display: grid; grid-template-columns: 14px 1fr; gap: 9px; align-items: start; }
    .center-key i { width: 11px; height: 11px; margin-top: 7px; border-radius: 50%; background: var(--warn); }
    .center-key.projected i { background: var(--accent); }
    .center-key strong, .center-key span { display: block; }
    .center-key span { color: var(--muted); font-size: 13px; }
    .flow-lanes { display: grid; gap: 10px; margin-top: 14px; }
    .flow-lane { display: grid; grid-template-columns: 44px minmax(100px, 1fr) 28px minmax(100px, 1fr) 28px minmax(100px, 1fr); gap: 8px; align-items: center; padding: 11px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface); }
    .lane-name { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: 18px; font-weight: 850; }
    .flow-node { min-height: 58px; display: grid; place-items: center; padding: 8px; border-radius: 9px; background: var(--surface-2); text-align: center; font-size: 13px; font-weight: 700; line-height: 1.35; }
    .flow-node.bridge { color: var(--warn); background: var(--warn-soft); }
    .flow-node.final { color: var(--good); background: var(--good-soft); }
    .flow-arrow { color: var(--muted); text-align: center; font-size: 22px; }
    .visual-caption { margin-top: 8px !important; color: var(--muted); font-size: 12px; text-align: right; }
    .scale-picture { display: grid; grid-template-columns: 1fr 38px 1fr; gap: 10px; align-items: stretch; margin-top: 14px; }
    .scale-box { display: grid; place-items: center; min-height: 92px; padding: 14px; border-radius: 11px; background: var(--good-soft); color: var(--good); text-align: center; }
    .scale-box.unsolved { background: var(--warn-soft); color: var(--warn); }
    .scale-box strong, .scale-box span { display: block; }
    .scale-box strong { font-size: 17px; }
    .scale-box span { margin-top: 4px; font-size: 12px; }
    .scale-divider { display: grid; place-items: center; color: var(--muted); font-weight: 850; }
    .result-picture { display: grid; gap: 12px; margin-top: 14px; }
    .metric-row { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 12px; align-items: center; }
    .metric-label { font-size: 13px; font-weight: 750; }
    .metric-bars { display: grid; gap: 5px; }
    .metric-bar { display: grid; grid-template-columns: minmax(0, 1fr) 68px; gap: 8px; align-items: center; }
    .bar-track { height: 20px; overflow: hidden; border-radius: 5px; background: var(--surface-2); }
    .bar-track.missing { display: grid; place-items: center; border: 1px dashed var(--line); background: transparent; color: var(--muted); font-size: 11px; }
    .bar-fill { height: 100%; background: var(--accent); }
    .bar-fill.original { background: var(--muted); }
    .bar-fill.candidate { background: var(--bad); }
    .bar-value { color: var(--muted); font-size: 12px; }
    .comparison-arrows { display: flex; flex-wrap: wrap; gap: 12px; margin: 2px 0 2px 162px; color: var(--muted); font-size: 12px; }
    .comparison-arrows strong { color: var(--text); }
    .verdict-strip { margin-top: 15px; padding: 12px 14px; border-left: 4px solid var(--bad); background: var(--bad-soft); color: var(--bad); font-weight: 700; }
    .raw-record summary { cursor: pointer; color: var(--accent); font-weight: 750; }
    .raw-record h4 { margin-top: 16px; }
    .raw-record p { color: var(--muted); font-size: 13px; }
    .thought-box { margin-top: 14px; }
    .thought-box textarea { min-height: 145px; resize: vertical; line-height: 1.6; }
    .thought-actions { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
    .primary-button { padding: 8px 13px; border: 1px solid var(--accent); border-radius: 8px; background: var(--accent); color: white; font-weight: 750; }
    .primary-button:hover { filter: brightness(.95); }
    .save-state { color: var(--good); font-size: 12px; }
    .todo-layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; }
    .todo-list { display: grid; gap: 10px; }
    .todo-item { padding: 14px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface-2); }
    .todo-item h3 { margin: 0 0 5px; font-size: 16px; }
    .todo-item p { margin: 0; color: var(--muted); font-size: 13px; white-space: pre-wrap; }
    .todo-meta { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; margin-top: 9px; color: var(--muted); font-size: 12px; }
    .todo-form { padding: 15px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface-2); }
    .todo-form label { display: block; margin: 0 0 5px; color: var(--muted); font-size: 12px; font-weight: 700; }
    .todo-form textarea { min-height: 105px; resize: vertical; }
    .todo-form .field + .field { margin-top: 10px; }
    .todo-form button { width: 100%; margin-top: 12px; }
    .muted { color: var(--muted); }
    .error { padding: 14px; border-radius: 9px; color: var(--bad); background: var(--bad-soft); }
    .footer { max-width: 1320px; margin: 0 auto; padding: 0 22px 46px; color: var(--muted); font-size: 12px; }
    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { position: static; }
      .sidebar .side-card:first-child { display: none; }
      .view-nav { grid-template-columns: repeat(3, 1fr); }
      .view-nav button { text-align: center; }
      .todo-layout { grid-template-columns: 1fr; }
    }
    @media (max-width: 620px) {
      .topbar { padding-top: 30px; }
      .app { padding: 18px 14px 50px; }
      .experiment-card { grid-template-columns: 48px minmax(0, 1fr); }
      .exp-arrow { display: none; }
      .detail-head { display: block; }
      .back-button { margin-top: 12px; }
      .detail-grid { grid-template-columns: 1fr; }
      .detail-card.full { grid-column: auto; }
      .center-picture { grid-template-columns: 1fr; }
      .flow-lane { grid-template-columns: 36px minmax(0, 1fr); }
      .flow-arrow { display: none; }
      .flow-node { grid-column: 2; }
      .metric-row { grid-template-columns: 1fr; }
      .comparison-arrows { margin-left: 0; }
      .scale-picture { grid-template-columns: 1fr; }
      .scale-divider { min-height: 26px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="eyebrow">MonoDGP · Experiment Desk</div>
      <h1>实验管理台</h1>
      <p class="lead">只管理 MonoDGP 这个项目：总账里的已做实验、每项实验的流程与结果、你的思考，以及尚未执行的待办方向。</p>
      <div class="top-actions">
        <a href="去噪专项分析.html">打开去噪专项分析</a>
        <a href="实验总账.md">打开实验总账</a>
      </div>
    </div>
  </header>

  <div class="app">
    <aside class="sidebar" aria-label="实验管理导航">
      <div class="side-card">
        <div class="side-title">项目概览</div>
        <div id="summary" class="stat-grid" aria-live="polite"></div>
      </div>
      <div class="side-card">
        <div class="side-title">查看</div>
        <nav class="view-nav">
          <button type="button" data-view="all" class="active">全部实验</button>
          <button type="button" data-view="denoising">去噪相关</button>
          <button type="button" data-view="todo">待办方向</button>
        </nav>
      </div>
      <div class="side-card source-note">
        页面数据来自：<code>docs/实验总账.md</code><br>
        用户思考与待办保存在当前浏览器的本地记录中，不会修改训练代码或实验产物。
      </div>
    </aside>

    <main>
      <section id="list-view" class="panel" aria-labelledby="list-title">
        <h2 id="list-title">已做实验</h2>
        <div class="toolbar">
          <label class="search"><span class="visually-hidden">搜索实验</span><input id="search" type="search" placeholder="搜索编号、名称、结果或脚本"></label>
          <select id="status-filter" aria-label="按状态筛选">
            <option value="all">所有状态</option>
            <option value="good">通过 / 采用</option>
            <option value="bad">判负 / FAIL</option>
            <option value="warn">未启动 / 中止 / 进行中</option>
          </select>
          <select id="category-filter" aria-label="按范围筛选">
            <option value="all">全部范围</option>
            <option value="denoising">去噪相关</option>
          </select>
          <span id="result-count" class="toolbar-note"></span>
        </div>
        <div id="load-state" class="muted">正在读取实验总账……</div>
        <div id="experiment-list" class="experiment-list" aria-live="polite"></div>
      </section>

      <section id="detail-view" class="panel" hidden aria-live="polite"></section>

      <section id="todo-view" class="panel" hidden>
        <h2>待办方向</h2>
        <p class="muted">这里放还没有正式执行的想法。标成“待讨论”不代表已经批准，也不代表已经启动 GPU 或训练。</p>
        <div class="todo-layout">
          <div id="todo-list" class="todo-list"></div>
          <form id="todo-form" class="todo-form">
            <h3>新增待办</h3>
            <div class="field"><label for="todo-title">想法名称</label><input id="todo-title" required placeholder="例如：非对称区间监督可学习性诊断"></div>
            <div class="field"><label for="todo-detail">想做什么</label><textarea id="todo-detail" placeholder="记录目的、关键风险或需要先确认的地方"></textarea></div>
            <button class="primary-button" type="submit">保存到待办</button>
          </form>
        </div>
      </section>
    </main>
  </div>

  <footer class="footer">MonoDGP 实验管理台 · 只读实验总账，浏览器本地保存用户补充思考与待办</footer>

  <script>
    (() => {
      "use strict";
      const DENOISING_IDS = new Set([
        6, 13, 14, 25, 26, 27, 28, 47, 50, 54, 75, 76, 84, 85, 86, 87,
        88, 89, 90, 91, 92, 93, 94, 95, 96, 97, 98, 99, 100, 101,
        102, 103, 104, 105, 106, 107, 108
      ]);
      const THOUGHT_SEEDS = {
        1: "用户总结：对于目标语义相同、前一阶段先定位而后一阶段继续修正的递进式任务，共用一个头或拆成两个专门头都可行；拆头的+0.0338只能视为可能略有帮助的线索。通过二维框中心再桥接到投影三维中心改变了接口语义，当时的小桥接层、冻结下游和5轮短训方案不太合理。",
        2: "用户认为：只要训练采用多组查询并让每组独立匹配，组间注意力隔离就是正常且合理的配套实现，应视为基线修正，不包装成创新。",
        3: "用户追问概率图如何采样，复盘发现旧脚本错误混入背景60米占位值。GPU batch 1完整重算确认当前中心采样线性融合没有收益。用户进一步澄清：真正关心的不是把激光雷达数值与最终深度直接融合，而是现有稠密深度分类分支产生的深度特征会送入三维解码器；若这套空间深度监督不可靠，后续应尝试仅在训练时把激光雷达点云投影到图像，监督更真实的深度特征，测试仍只输入图像。",
        4: "复盘纠正：实验四并非只有一组查询。实验四和五训练时都有11组×50个查询并做11份独立匹配；四让550个查询全局互看，五按组隔离注意力。用户认为更一致的多组训练可能带来更好泛化，但当前直接证据是验证精度提高，泛化机制未单独验证。",
        13: "用户指出：序号13只是把同一个投影公式重新算一遍，没有产生新的可学习信息。",

          const todoTag = hasPendingTodo(item.id) ? `<span class="status warn">有待办</span>` : "";
          return `<button type="button" class="experiment-card" data-exp-id="${item.id}">
            <span class="exp-number">${String(item.id).padStart(2, "0")}</span>
            <span>
              <span class="exp-title">${escapeHtml(item.title)}</span>
              <span class="exp-meta"><span>${escapeHtml(item.date)}</span><span>·</span><span>${scope}</span><span class="status ${kind}">${escapeHtml(compact(item.status, 84))}</span>${todoTag}</span>
              <span class="exp-preview">${escapeHtml(compact(item.result))}</span>
            </span>
            <span class="exp-arrow" aria-hidden="true">›</span>
          </button>`;
        }).join("");
        document.querySelectorAll("[data-exp-id]").forEach((button) => button.addEventListener("click", () => showDetail(Number(button.dataset.expId))));
      };
      const paragraphs = (text) => String(text ?? "").split(/[。；]/).map((part) => part.trim()).filter(Boolean);
      const renderPlainReview = (item) => {
        if (item.id !== 1) return "";
        return `<article class="detail-card full visual-review">
          <h3>一张图先看懂：两个“中心”不是一回事</h3>
          <div class="center-picture">
            <svg viewBox="0 0 360 190" role="img" aria-label="二维框正中心与投影三维中心位置不同的示意图">
              <rect class="box-shape" x="35" y="24" width="290" height="142" rx="5"></rect>
              <path class="car-shape" d="M76 118 L96 73 Q103 57 122 57 H234 Q252 57 262 75 L283 118 V145 H76 Z"></path>
              <circle class="true2d-dot" cx="180" cy="95" r="9"></circle>
              <circle class="projected-dot" cx="220" cy="88" r="9"></circle>
              <path d="M190 94 L207 90" stroke="currentColor" stroke-width="2" marker-end="url(#arrowhead)"></path>
              <defs><marker id="arrowhead" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="currentColor"></path></marker></defs>
            </svg>
            <div class="center-legend">
              <div class="center-key"><i></i><div><strong>二维框正中心</strong><span>框的几何中点，B组第一阶段学习它</span></div></div>
              <div class="center-key projected"><i></i><div><strong>投影三维中心</strong><span>三维框中心投到图像的位置，三维检测真正需要它</span></div></div>
            </div>
          </div>

          <h3 style="margin-top:20px">A / C / B：不是投票，而是前后接力</h3>
          <div class="flow-lanes" aria-label="三组实验流程对照">
            <div class="flow-lane"><span class="lane-name">A</span><span class="flow-node">二维阶段<br>共用头 X</span><span class="flow-arrow">→</span><span class="flow-node">三维阶段<br>仍用头 X</span><span class="flow-arrow">→</span><span class="flow-node final">最终输出</span></div>
            <div class="flow-lane"><span class="lane-name">C</span><span class="flow-node">二维阶段<br>独立头 X<br>学投影三维中心</span><span class="flow-arrow">→</span><span class="flow-node">三维阶段<br>独立头 Y<br>继续修正</span><span class="flow-arrow">→</span><span class="flow-node final">认准 Y 的输出</span></div>
            <div class="flow-lane"><span class="lane-name">B</span><span class="flow-node">二维阶段<br>学二维框中心</span><span class="flow-arrow">→</span><span class="flow-node bridge">两层桥接网络<br>预测 Δx、Δy</span><span class="flow-arrow">→</span><span class="flow-node final">三维阶段修正<br>并最终输出</span></div>
          </div>
          <p class="visual-caption">C只检查“拆头”有没有伤害；B才是要验证的中心转换方案。</p>

          <h3 style="margin-top:20px">你指出的尺度问题：只解决了一半</h3>
          <div class="scale-picture">
            <div class="scale-box"><div><strong>✓ 数字尺度已处理</strong><span>像素先除以图像宽高，偏移再限幅；不是直接回归15、20像素</span></div></div>
            <div class="scale-divider">但</div>
            <div class="scale-box unsolved"><div><strong>! 逐车规律仍难学</strong><span>方向、幅度、遮挡和透视成因都不同，小桥接层未必推得准</span></div></div>
          </div>

          <h3 style="margin-top:20px">结果：拆头没事，桥接方案变差</h3>
          <div class="result-picture" aria-label="A组、C组与B组结果对照">
            <div class="metric-row"><span class="metric-label">Moderate 3D精度<br>越高越好</span><div class="metric-bars"><div class="metric-bar"><span class="bar-track"><span class="bar-fill original" style="display:block;width:97.8%"></span></span><span class="bar-value">A　21.510</span></div><div class="metric-bar"><span class="bar-track"><span class="bar-fill" style="display:block;width:97.9%"></span></span><span class="bar-value">C　21.544</span></div><div class="metric-bar"><span class="bar-track"><span class="bar-fill candidate" style="display:block;width:89.7%"></span></span><span class="bar-value">B　19.729</span></div></div></div>
            <div class="comparison-arrows"><span><strong>A → C：+0.034</strong>　拆头几乎没影响</span><span><strong>C → B：−1.815</strong>　桥接方案明显下降</span></div>
            <div class="metric-row"><span class="metric-label">最终投影中心误差<br>越低越好</span><div class="metric-bars"><div class="metric-bar"><span class="bar-track missing">当时没有计算这项</span><span class="bar-value">A　缺测</span></div><div class="metric-bar"><span class="bar-track"><span class="bar-fill" style="display:block;width:72%"></span></span><span class="bar-value">C　5.06px</span></div><div class="metric-bar"><span class="bar-track"><span class="bar-fill candidate" style="display:block;width:75.6%"></span></span><span class="bar-value">B　5.31px</span></div></div></div>
            <div class="comparison-arrows"><span><strong>A的中心误差不能与C比较</strong>　原实验没有保存A的逐对象机制指标</span></div>
          </div>
          <div class="verdict-strip">只否定当时“小桥接层＋冻结大部分网络＋续训5轮”的实现，不等于二维中心永远无用。</div>
        </article>`;
      };
      const renderDetail = (item) => {
        const kind = statusKind(item.status);
        const todoTag = hasPendingTodo(item.id) ? `<span class="status warn">有待办</span>` : "";
        const localThoughts = loadThoughts();
        const thought = Object.prototype.hasOwnProperty.call(localThoughts, String(item.id)) ? localThoughts[String(item.id)] : item.thought;
        const flow = paragraphs(item.workflow);
        const result = paragraphs(item.result);
        const reviewHtml = renderPlainReview(item);
        const recordHtml = item.id === 1
          ? `<details class="detail-card full raw-record"><summary>查看原始流程、配置和完整文字记录</summary><h4>实验流程</h4><p>${escapeHtml(item.workflow)}</p><h4>配置与脚本</h4><p>${escapeHtml(item.source)}</p><h4>输出与日志</h4><p>${escapeHtml(item.output)}</p><h4>结果与限制</h4><p>${escapeHtml(item.result)}</p></details>`
          : `<article class="detail-card full"><h3>实验流程 / 实际怎么做</h3><ol>${(flow.length ? flow : [item.workflow]).map((part) => `<li>${escapeHtml(part)}</li>`).join("")}</ol></article><article class="detail-card"><h3>配置与脚本</h3><p>${escapeHtml(item.source)}</p></article><article class="detail-card"><h3>输出与日志</h3><p>${escapeHtml(item.output)}</p></article><article class="detail-card full"><h3>结果、结论与限制</h3><ul>${(result.length ? result : [item.result]).map((part) => `<li>${escapeHtml(part)}</li>`).join("")}</ul></article>`;
        $("#detail-view").innerHTML = `<div class="detail-head">
          <div><span class="detail-number">${String(item.id).padStart(2, "0")}</span><h2 class="detail-title">${escapeHtml(item.title)}</h2>
            <div class="detail-meta"><span>${escapeHtml(item.date)}</span><span class="status ${kind}">${escapeHtml(item.status)}</span>${todoTag}<span>${item.category === "denoising" ? "去噪相关" : "项目实验"}</span></div>
          </div>
          <button type="button" class="back-button" id="back-to-list">← 返回实验列表</button>
        </div>
        <div class="detail-grid">
          ${reviewHtml}
          ${recordHtml}
          <article class="detail-card full thought-box"><h3>我的思考</h3><p class="muted">这里记录你对该实验的判断、质疑、后续想法。预置内容来自已有讨论；新增内容保存在当前浏览器本地。</p><textarea id="thought-input" aria-label="实验思考">${escapeHtml(thought)}</textarea><div class="thought-actions"><button type="button" class="primary-button" id="save-thought">保存我的思考</button><span id="save-state" class="save-state" role="status"></span></div></article>
        </div>`;
        $("#list-view").hidden = true;
        $("#todo-view").hidden = true;
        $("#detail-view").hidden = false;
        $("#back-to-list").addEventListener("click", () => { state.selectedId = null; history.replaceState(null, "", `${location.pathname}`); showView("all"); });
        $("#save-thought").addEventListener("click", () => { saveThought(item.id, $("#thought-input").value); $("#save-state").textContent = "已保存到本浏览器"; });
        history.replaceState(null, "", `#exp-${item.id}`);
        window.scrollTo({ top: 0, behavior: "smooth" });
      };
      const showDetail = (id) => {
        const item = state.experiments.find((candidate) => candidate.id === id);
        if (item) { state.selectedId = id; renderDetail(item); }
      };
      const renderTodos = () => {
        if (!state.todos.length) { $("#todo-list").innerHTML = `<div class="empty">还没有待办方向。</div>`; return; }
        $("#todo-list").innerHTML = state.todos.map((todo) => `<article class="todo-item"><h3>${escapeHtml(todo.title)}</h3><p>${escapeHtml(todo.detail)}</p><div class="todo-meta"><span class="status warn">${escapeHtml(todo.status || "待讨论")}</span><span>${escapeHtml(todo.source || "浏览器本地新增")}</span></div></article>`).join("");
      };
      const showView = (view) => {
        state.view = view;
        document.querySelectorAll(".view-nav button").forEach((button) => button.classList.toggle("active", button.dataset.view === view));
        $("#detail-view").hidden = true;
        $("#list-view").hidden = view === "todo";
        $("#todo-view").hidden = view !== "todo";
        if (view === "denoising") { state.category = "denoising"; $("#category-filter").value = "denoising"; }
        if (view === "all") { state.category = "all"; $("#category-filter").value = "all"; }
        if (view === "todo") renderTodos(); else renderList();
        window.scrollTo({ top: 0, behavior: "smooth" });
      };
      const boot = async () => {
        state.todos = loadTodos();
        $("#search").addEventListener("input", (event) => { state.query = event.target.value; renderList(); });
        $("#status-filter").addEventListener("change", (event) => { state.status = event.target.value; renderList(); });
        $("#category-filter").addEventListener("change", (event) => { state.category = event.target.value; renderList(); });
        document.querySelectorAll(".view-nav button").forEach((button) => button.addEventListener("click", () => showView(button.dataset.view)));
        $("#todo-form").addEventListener("submit", (event) => {
          event.preventDefault();
          const title = $("#todo-title").value.trim();
          const detail = $("#todo-detail").value.trim();
          if (!title) return;
          state.todos.push({ id: `local-${Date.now()}`, title, detail, status: "待讨论", source: "浏览器本地新增" });
          saveTodos(); renderTodos(); event.target.reset();
        });
        try {
          const response = await fetch(`实验总账.md?ts=${Date.now()}`, { cache: "no-store" });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          state.experiments = parseLedger(await response.text());
          renderSummary(); renderList(); $("#load-state").textContent = `已从实验总账读取 ${state.experiments.length} 条记录`;
          const match = location.hash.match(/^#exp-(\d+)$/);
          if (match) showDetail(Number(match[1]));
        } catch (error) {
          $("#load-state").innerHTML = `<div class="error">无法读取实验总账：${escapeHtml(error.message)}。请通过当前实时网页服务器打开本页，不要直接双击 HTML 文件。</div>`;
        }
      };
      boot();
    })();
  </script>
</body>
</html>
